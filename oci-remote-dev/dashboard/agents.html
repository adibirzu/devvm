<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Board — OCI Agentic Dev OS</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #090b10; --card: rgba(255,255,255,.03); --border: rgba(255,255,255,.08);
      --accent: #6c5ce7; --muted: #8a90a2; --text: #e9ecf5;
      --running: #29c46b; --attached: #4aa3ff; --dead: #e0a13a;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: Outfit, system-ui, sans-serif; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
    header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 1rem; margin-bottom: 2rem; }
    h1 { font-size: clamp(1.6rem, 1rem + 2vw, 2.6rem); margin: 0; }
    .sub { color: var(--muted); }
    .totals { display: flex; gap: 1.5rem; flex-wrap: wrap; margin: 1rem 0 2.5rem; }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.4rem; min-width: 130px; }
    .stat .n { font-size: 1.8rem; font-weight: 800; }
    .stat .l { color: var(--muted); font-size: .85rem; }
    .dev { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.25rem; }
    .dev h2 { margin: 0 0 1rem; display: flex; justify-content: space-between; align-items: center; }
    .cost { font-size: .9rem; color: var(--muted); font-weight: 400; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .5rem .6rem; font-size: .92rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    .pill { padding: .15rem .6rem; border-radius: 20px; font-size: .78rem; font-weight: 600; }
    .running { background: rgba(41,196,107,.15); color: var(--running); }
    .attached { background: rgba(74,163,255,.15); color: var(--attached); }
    .dead { background: rgba(224,161,58,.15); color: var(--dead); }
    .empty { color: var(--muted); font-style: italic; }
    footer { color: var(--muted); margin-top: 2rem; font-size: .85rem; display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
    a { color: var(--accent); }
    .ctrl { background: var(--card); border: 1px solid var(--border); color: var(--text);
            border-radius: 8px; padding: .35rem .8rem; font: inherit; cursor: pointer; }
    .ctrl:active { transform: scale(.97); }
    /* Notification ring — pulses on developers/sessions waiting for input. */
    @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(224,161,58,.55); }
                      70% { box-shadow: 0 0 0 12px rgba(224,161,58,0); }
                      100% { box-shadow: 0 0 0 0 rgba(224,161,58,0); } }
    .needs-input { animation: ring 1.6s infinite; border-color: var(--dead) !important; }
    .bell { color: var(--dead); font-weight: 700; }
    .notifs { display: flex; flex-direction: column; gap: .5rem; margin: 0 0 1.5rem; }
    .notif { background: rgba(224,161,58,.08); border: 1px solid rgba(224,161,58,.3);
             border-radius: 10px; padding: .6rem .9rem; font-size: .9rem; }
    .notif .when { color: var(--muted); }

    /* Mobile: monitor from a phone over the VPN. Stack the wide session tables into
       labelled rows; keep the narrow project tables as-is. */
    @media (max-width: 640px) {
      .wrap { padding: 1.5rem 1rem 3rem; }
      header { flex-direction: column; align-items: flex-start; gap: .5rem; }
      h1 { font-size: 1.7rem; }
      .totals { gap: .6rem; }
      .stat { min-width: 0; flex: 1 1 42%; padding: .7rem .9rem; }
      .stat .n { font-size: 1.4rem; }
      .dev { padding: 1.1rem; }
      .dev h2 { flex-direction: column; align-items: flex-start; gap: .25rem; font-size: 1.15rem; }
      table.sessions, table.sessions tbody, table.sessions tr, table.sessions td { display: block; }
      table.sessions thead { position: absolute; left: -9999px; }
      table.sessions tr { border-bottom: 1px solid var(--border); padding: .5rem 0; }
      table.sessions td { border: none; padding: .2rem 0; display: flex; justify-content: space-between; gap: 1rem; }
      table.sessions td::before { content: attr(data-label); color: var(--muted); font-weight: 600; }
      .ctrl { padding: .5rem 1rem; }  /* bigger touch target */
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>🛰️ Agent Board</h1>
        <div class="sub">Live coding-agent sessions across the team — durable through disconnects.</div>
      </div>
      <div style="display:flex;gap:1rem;align-items:center;">
        <span id="gw" class="pill dead" title="MultiLLM gateway health">● gateway</span>
        <a href="/">← Dashboard</a>
      </div>
    </header>
    <div class="totals" id="totals"></div>
    <div class="notifs" id="notifs"></div>
    <div id="board"><p class="empty">Loading…</p></div>
    <h2 style="margin:2.5rem 0 1rem;">📁 Projects</h2>
    <div id="projects"><p class="empty">Loading…</p></div>
    <h2 style="margin:2.5rem 0 1rem;">🛡️ Guardrail — recent tool decisions</h2>
    <div id="guardrail"><p class="empty">Loading…</p></div>
    <footer>
      <button class="ctrl" id="refresh">↻ Refresh</button>
      <button class="ctrl" id="pause">⏸ Pause</button>
      <button class="ctrl" id="alerts">🔔 Enable alerts</button>
      <span id="foot"></span>
    </footer>
  </div>
  <script>
    const ST = { running: "running", attached: "attached", dead: "dead" };
    let notifReady = false;   // becomes true after the first poll so we don't alert on history
    function fmtCost(c) { return "$" + (Number(c) || 0).toFixed(4); }
    function render(data) {
      const t = data.totals || { sessions: 0, running: 0, cost_usd: 0, needs_input: 0 };
      document.getElementById("totals").innerHTML = `
        <div class="stat ${t.needs_input ? "needs-input" : ""}"><div class="n">${t.needs_input || 0}</div><div class="l">🔔 need input</div></div>
        <div class="stat"><div class="n">${t.running}</div><div class="l">active sessions</div></div>
        <div class="stat"><div class="n">${t.blocked || 0}</div><div class="l">🛡️ blocked · 1h</div></div>
        <div class="stat ${t.over_budget ? "needs-input" : ""}"><div class="n">${t.over_budget || 0}</div><div class="l">💸 over budget</div></div>
        <div class="stat"><div class="n">${fmtCost(t.cost_usd)}</div><div class="l">LLM cost · 24h</div></div>`;
      // Gateway health pill
      const gw = document.getElementById("gw");
      const up = data.gateway && data.gateway.up;
      gw.className = "pill " + (up ? "running" : "dead");
      gw.textContent = (up ? "● gateway up" : "● gateway down");
      renderNotifs(data);
      renderGuardrail(data);
      const board = document.getElementById("board");
      const devs = data.developers || [];
      if (!devs.length) { board.innerHTML = `<p class="empty">No developers found.</p>`; return; }
      board.innerHTML = devs.map(d => {
        const rows = (d.sessions || []).map(s => `
          <tr>
            <td data-label="Agent">${s.needs_input ? '<span class="bell">🔔 </span>' : ""}${s.agent}</td><td data-label="Project">${s.project}</td>
            <td data-label="State"><span class="pill ${ST[s.state] || "dead"}">${s.state}</span></td>
            <td data-label="Dir">${s.dir || ""}</td><td data-label="Started">${s.started_at || ""}</td>
          </tr>`).join("");
        const body = rows || `<tr><td colspan="5" class="empty">no sessions</td></tr>`;
        const bell = d.needs_input ? '<span class="bell">🔔</span> ' : "";
        const budget = d.budget
          ? ` <span class="pill ${d.budget.over ? "dead" : "running"}">${fmtCost(d.budget.spent)}/${fmtCost(d.budget.cap)}${d.budget.over ? " 💸 over" : ""}</span>`
          : "";
        return `<div class="dev ${d.needs_input ? "needs-input" : ""}"><h2>${bell}${d.name}<span class="cost">${fmtCost(d.cost_usd_24h)} · 24h${budget}</span></h2>
          <table class="sessions"><thead><tr><th>Agent</th><th>Project</th><th>State</th><th>Dir</th><th>Started</th></tr></thead>
          <tbody>${body}</tbody></table></div>`;
      }).join("");
    }
    // Collect notifications across developers, render a strip, and fire browser
    // notifications for any we haven't shown yet (phone alerts over the VPN).
    const seenNotifs = new Set();
    function renderNotifs(data) {
      const all = [];
      for (const d of (data.developers || [])) for (const n of (d.notifications || [])) all.push({ ...n, dev: d.name });
      all.sort((a, b) => (b.ts || "").localeCompare(a.ts || ""));
      const box = document.getElementById("notifs");
      box.innerHTML = all.slice(0, 6).map(n =>
        `<div class="notif"><span class="bell">🔔</span> <strong>${n.dev}/${n.session || "?"}</strong> ${n.message || ""} <span class="when">· ${n.ts || ""}</span></div>`
      ).join("");
      for (const n of all) {
        const key = (n.ts || "") + "|" + (n.session || "") + "|" + (n.message || "");
        if (seenNotifs.has(key)) continue;
        seenNotifs.add(key);
        if (notifReady && "Notification" in window && Notification.permission === "granted") {
          try { new Notification("🔔 " + (n.dev || "") + "/" + (n.session || ""), { body: n.message || "needs input", tag: key }); } catch (e) {}
        }
      }
      if (seenNotifs.size > 500) seenNotifs.clear();  // bound memory
    }
    function gitBadge(g) {
      if (!g) return `<span class="pill dead">no git</span>`;
      const clean = g.clean ? `<span class="pill running">clean</span>`
                            : `<span class="pill dead">${g.dirty || 0}±, ${g.untracked || 0}?</span>`;
      const track = (g.ahead || g.behind)
        ? ` <span class="cost">↑${g.ahead || 0} ↓${g.behind || 0}</span>` : "";
      return `<strong>${g.branch || "?"}</strong> ${clean}${track}`;
    }
    function renderProjects(data) {
      const box = document.getElementById("projects");
      const ps = (data && data.projects) || [];
      if (!ps.length) { box.innerHTML = `<p class="empty">No active projects.</p>`; return; }
      box.innerHTML = ps.map(p => {
        const lc = (p.git && p.git.last_commit) || {};
        const commit = lc.hash ? `${lc.hash} · ${lc.subject || ""} <span class="cost">(${lc.when || ""})</span>` : "—";
        const agents = (p.active_agents || [])
          .map(a => `<span class="pill ${a.state === "dead" ? "dead" : (a.state === "attached" ? "attached" : "running")}">${a.user}/${a.agent}</span>`)
          .join(" ") || `<span class="empty">none</span>`;
        return `<div class="dev"><h2>${p.project}<span class="cost">${p.dir || ""}</span></h2>
          <table><tbody>
            <tr><td style="width:12rem;">Git</td><td>${gitBadge(p.git)}</td></tr>
            <tr><td>Last commit</td><td>${commit}</td></tr>
            <tr><td>Active agents</td><td>${agents}</td></tr>
          </tbody></table></div>`;
      }).join("");
    }
    function renderGuardrail(data) {
      const g = data.guardrail || { recent: [], denied: 0, asked: 0 };
      const box = document.getElementById("guardrail");
      if (!g.recent || !g.recent.length) {
        box.innerHTML = `<p class="empty">No tool calls blocked or held for confirmation in the last hour.</p>`;
        return;
      }
      const rows = g.recent.map(e => {
        const cls = e.action === "deny" ? "dead" : "attached";
        const label = e.action === "deny" ? "DENY" : "ASK";
        return `<tr>
          <td data-label="Decision"><span class="pill ${cls}">${label}</span></td>
          <td data-label="Who">${e.user || ""}</td>
          <td data-label="Rule">${e.rule || ""}</td>
          <td data-label="Action">${(e.summary || "").replace(/</g, "&lt;")}</td>
          <td data-label="When">${e.ts || ""}</td>
        </tr>`;
      }).join("");
      box.innerHTML = `<div class="dev"><table class="sessions">
        <thead><tr><th>Decision</th><th>Who</th><th>Rule</th><th>Action</th><th>When</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`;
    }
    async function tick() {
      let ok = false;
      try {
        const r = await fetch("/agents.json?ts=" + Date.now(), { cache: "no-store" });
        render(await r.json()); ok = true;
      } catch (e) {
        document.getElementById("board").innerHTML = `<p class="empty">agents.json unavailable — is agent-status.timer running?</p>`;
      }
      try {
        const rp = await fetch("/projects.json?ts=" + Date.now(), { cache: "no-store" });
        renderProjects(await rp.json());
      } catch (e) {
        document.getElementById("projects").innerHTML = `<p class="empty">projects.json unavailable.</p>`;
      }
      document.getElementById("foot").textContent = (ok ? "Updated " + new Date().toLocaleTimeString() : "partial data") + (paused ? " · paused" : " · auto 15s");
    }
    // Pause/refresh — handy on mobile (battery) and when reading a snapshot.
    let paused = false, timer = null;
    function loop() { if (timer) clearInterval(timer); if (!paused) timer = setInterval(tick, 15000); }
    document.getElementById("refresh").addEventListener("click", tick);
    document.getElementById("pause").addEventListener("click", (e) => {
      paused = !paused; e.target.textContent = paused ? "▶ Resume" : "⏸ Pause"; loop(); if (!paused) tick();
    });
    // Don't poll while the tab/app is backgrounded (mobile-friendly).
    document.addEventListener("visibilitychange", () => { if (document.hidden) { if (timer) clearInterval(timer); } else if (!paused) { tick(); loop(); } });
    // Phone alerts: request Notification permission on user gesture (required by browsers).
    document.getElementById("alerts").addEventListener("click", (e) => {
      if (!("Notification" in window)) { e.target.textContent = "alerts unsupported"; return; }
      Notification.requestPermission().then(p => {
        e.target.textContent = p === "granted" ? "🔔 Alerts on" : "🔔 Alerts blocked";
      });
    });
    if ("Notification" in window && Notification.permission === "granted")
      document.getElementById("alerts").textContent = "🔔 Alerts on";
    // First poll seeds the seen-set (no alert storm for existing notifications), then arm.
    tick().then(() => { notifReady = true; }); loop();
  </script>
</body>
</html>
