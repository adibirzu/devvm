name: Security Compliance Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-gate:
    name: OCI Infrastructure Security Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Security Gate Compliance Scanner
        run: |
          chmod +x scripts/security_gate.py
          python scripts/security_gate.py --mode full
