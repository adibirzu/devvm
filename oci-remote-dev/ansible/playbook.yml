---
# Multi-developer agentic dev workspace.
# -----------------------------------------------------------------------------
# Runs identically against:
#   * a freshly provisioned cloud VM (scripts/deploy.sh — cloud-init created the
#     accounts and brought WireGuard up first), and
#   * any existing Linux machine (./install.sh — this play owns the accounts and,
#     with --wireguard, the tunnel too).
#
# Distro-specific package names, service names and the firewall backend live in
# vars/<os_family>.yml, so the task bodies stay the same on Ubuntu/Debian and on
# Oracle Linux/RHEL/Rocky/AlmaLinux/Fedora.
- name: Configure Multi-Developer Collaboration Environment
  hosts: all
  become: true
  vars:
    node_version: "20"
    install_cursor: true
    install_claude_code: true
    install_codex: true
    install_gemini: true
    # Additional agent CLIs. Default OFF so an existing deployment does not
    # silently grow new global installs on its next run — opt in per tool via
    # the matching INSTALL_* env flag (see .env.example and docs/TOOLCHAIN.md).
    install_opencode: false
    install_pi: false            # needs Node >= 22 (set NODE_VERSION=22)
    install_grok: false
    install_cline: false
    install_copilot_cli: false   # needs Node >= 22 (set NODE_VERSION=22)
    install_cursor_agent: false
    # Local LLM serving (Ollama) + wiring for the coding clients.
    install_ollama: false
    ollama_bind_address: ""      # empty = follow wg_server_ip (loopback without --wireguard)
    ollama_port: 11434
    ollama_models: ""            # comma-separated models to pull after install, e.g. qwen3-coder,gpt-oss:20b
    ollama_default_model: "qwen3-coder"
    # Same binding rule as every other service here: follow the WireGuard/tunnel
    # address when there is one, loopback otherwise (--bind-address wins).
    ollama_effective_bind: "{{ ollama_bind_address if (ollama_bind_address | default('')) | length > 0 else wg_server_ip }}"
    install_code_server: true
    install_podman: true
    install_dev_tools: true
    install_github_cli: true
    install_csp_clis: true
    install_aws_cli: true
    install_azure_cli: true
    install_gcp_cli: true
    install_oci_cli: true
    install_multillm_gateway: true
    multillm_gateway_port: 8080
    install_resilience_layer: true
    install_agent_os: true
    multillm_source_path: ""
    multillm_git_url: "https://github.com/adibirzu/multillm.git"
    multillm_git_version: "main"
    # OCI Administrator skill pack (Claude/Codex/Gemini/Antigravity) — installed
    # per-developer from /opt/oci-skills. Public repo, works OOTB.
    install_oci_skills: true
    install_antigravity: true
    oci_skills_source_path: ""
    oci_skills_git_url: "https://github.com/adibirzu/oci-skills.git"
    oci_skills_git_version: "main"
    # Host-level layers. A cloud deploy leaves WireGuard to cloud-init; a direct
    # install can opt into it with install_wireguard=true (./install.sh --wireguard).
    install_desktop: true
    configure_firewall: true
    install_wireguard: false
    dashboard_port: 80
    rdp_port: 3389
    wg_port: 51820
    control_plane_port: 8082
    # developers list will be passed as extra_vars
    developers: []
    wg_server_ip: "10.200.200.1"
    wg_network: "10.200.200.0/24"

  pre_tasks:
    - name: Verify this OS family is supported
      ansible.builtin.assert:
        that: ansible_os_family in ['Debian', 'RedHat']
        fail_msg: >-
          Unsupported OS family '{{ ansible_os_family }}'
          ({{ ansible_distribution }} {{ ansible_distribution_version }}).
          Supported: the Debian family (Debian, Ubuntu, Mint) and the RedHat family
          (Oracle Linux, RHEL, Rocky, AlmaLinux, CentOS, Fedora). To extend it, add
          ansible/vars/<os_family>.yml mirroring the existing ones.
        success_msg: >-
          Detected {{ ansible_distribution }} {{ ansible_distribution_version }}
          ({{ ansible_os_family }} family)

    - name: Load the OS-family package and service names
      ansible.builtin.include_vars: "vars/{{ ansible_os_family }}.yml"

    - name: Update the APT cache (Debian family)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'

    # EPEL carries xrdp, the XFCE session, mosh and pipx on the RedHat family.
    # Oracle Linux ships its own release package under a different name.
    - name: Enable EPEL (RedHat family)
      when: os_needs_epel | default(false) | bool
      block:
        - name: Install the EPEL release package
          ansible.builtin.package:
            name: epel-release
            state: present
      rescue:
        - name: Install the Oracle Linux EPEL release package
          ansible.builtin.package:
            name: "oracle-epel-release-el{{ ansible_distribution_major_version }}"
            state: present

        - name: Enable the Oracle Linux developer EPEL repository
          ansible.builtin.command:
            cmd: "dnf config-manager --set-enabled ol{{ ansible_distribution_major_version }}_developer_EPEL"
          register: ol_epel_enable
          changed_when: false
          failed_when: false

  tasks:
    - name: Ensure developers group exists
      ansible.builtin.group:
        name: developers
        state: present

    # On a cloud VM cloud-init created these accounts already; on a direct install
    # this is where they come from. Idempotent either way.
    - name: Ensure each developer account exists
      ansible.builtin.user:
        name: "{{ item.name }}"
        shell: /bin/bash
        create_home: true
        groups: "{{ ['developers', os_admin_sudo_group] | unique }}"
        append: true
      loop: "{{ developers }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Authorize each developer's SSH public key
      ansible.posix.authorized_key:
        user: "{{ item.name }}"
        key: "{{ item.ssh_key }}"
        state: present
      loop: "{{ developers }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Install base packages, cloud CLIs and Node.js
      ansible.builtin.include_tasks: packages_tasks.yml

    - name: Install the XFCE desktop and XRDP
      ansible.builtin.include_tasks: desktop_tasks.yml
      when: install_desktop | default(true)

    - name: Create secure shared workspace directory
      ansible.builtin.file:
        path: /opt/shared-dev
        state: directory
        owner: root
        group: developers
        mode: '2770'

    - name: Setup developer shared workspace symlinks and umask
      block:
        # follow: false is load-bearing — with the default the owner/group would be
        # applied through the link to /opt/shared-dev itself, leaving the shared
        # workspace owned by whichever developer the loop happened to end on and
        # locking everyone else out.
        - name: Link shared workspace in homes
          ansible.builtin.file:
            src: /opt/shared-dev
            dest: "/home/{{ item.name }}/shared-workspace"
            state: link
            follow: false
            owner: "{{ item.name }}"
            group: "{{ item.name }}"
          loop: "{{ developers }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Configure umask 002 for developers
          ansible.builtin.lineinfile:
            path: "/home/{{ item.name }}/.bashrc"
            line: "umask 002"
            insertafter: EOF
            state: present
            create: true
            owner: "{{ item.name }}"
            group: "{{ item.name }}"
            mode: '0644'
          loop: "{{ developers }}"
          loop_control:
            label: "{{ item.name }}"
    - name: Download Cursor AppImage globally (x86_64 only)
      # Upstream publishes the desktop AppImage for x64 only; on arm64 this is
      # skipped with a note instead of leaving a broken/wrong-arch download
      # behind (the cursor-agent CLI is a separate, arch-aware install).
      when: install_cursor and ansible_architecture == 'x86_64'
      block:
        - name: Create Cursor directory
          ansible.builtin.file:
            path: /opt/cursor
            state: directory
            mode: '0755'

        - name: Download Cursor binary
          ansible.builtin.get_url:
            url: "https://downloader.cursor.sh/linux/appImage/x64"
            dest: /opt/cursor/cursor.AppImage
            mode: '0755'
          ignore_errors: true

    - name: Note Cursor IDE skipped (no arm64 AppImage published upstream)
      ansible.builtin.debug:
        msg: >-
          install_cursor is enabled but the Cursor IDE AppImage is x86_64-only;
          it was skipped on {{ ansible_architecture }}. The cursor-agent CLI
          supports arm64 and can be installed instead (INSTALL_CURSOR_AGENT=true).
      when: install_cursor and ansible_architecture != 'x86_64'

    - name: Provision the MultiLLM gateway source
      when: install_multillm_gateway | default(true)
      block:
        # Use a local checkout if the operator has one beside the project (offline /
        # development); otherwise clone the public repo so a fresh deploy works OOTB.
        - name: Check for a local MultiLLM checkout on the controller
          ansible.builtin.stat:
            path: "{{ playbook_dir }}/{{ multillm_source_path | default('') }}"
          delegate_to: localhost
          become: false
          register: multillm_local
          when: (multillm_source_path | default('')) | length > 0

        - name: Copy the local MultiLLM source to the VM (offline / development)
          ansible.builtin.copy:
            src: "{{ multillm_source_path }}"
            dest: /opt/
            owner: root
            group: developers
            mode: '0775'
          when: multillm_local.stat is defined and multillm_local.stat.exists

        - name: Clone MultiLLM from GitHub (default — public repo, works OOTB)
          ansible.builtin.git:
            repo: "{{ multillm_git_url | default('https://github.com/adibirzu/multillm.git') }}"
            dest: /opt/multillm
            version: "{{ multillm_git_version | default('main') }}"
            depth: 1
            force: true
          when: not (multillm_local.stat is defined and multillm_local.stat.exists)

        - name: Ensure /opt/multillm is group-accessible to developers
          ansible.builtin.file:
            path: /opt/multillm
            state: directory
            owner: root
            group: developers
            mode: '0775'
            recurse: false

    - name: Provision the OCI Administrator skill pack source
      when: install_oci_skills | default(true)
      tags: [oci_skills]
      block:
        # Prefer a local checkout beside the project (offline / development);
        # otherwise clone the public repo so a fresh deploy works OOTB.
        - name: Check for a local oci-skills checkout on the controller
          ansible.builtin.stat:
            path: "{{ playbook_dir }}/{{ oci_skills_source_path | default('') }}"
          delegate_to: localhost
          become: false
          register: oci_skills_local
          when: (oci_skills_source_path | default('')) | length > 0

        - name: Copy the local oci-skills source to the VM (offline / development)
          ansible.builtin.copy:
            src: "{{ oci_skills_source_path }}"
            dest: /opt/
            owner: root
            group: developers
            mode: '0775'
          when: oci_skills_local.stat is defined and oci_skills_local.stat.exists

        - name: Clone oci-skills from GitHub (default — public repo, works OOTB)
          ansible.builtin.git:
            repo: "{{ oci_skills_git_url | default('https://github.com/adibirzu/oci-skills.git') }}"
            dest: /opt/oci-skills
            version: "{{ oci_skills_git_version | default('main') }}"
            depth: 1
            force: true
          when: not (oci_skills_local.stat is defined and oci_skills_local.stat.exists)

        - name: Ensure /opt/oci-skills is group-accessible to developers
          ansible.builtin.file:
            path: /opt/oci-skills
            state: directory
            owner: root
            group: developers
            mode: '0775'
            recurse: false

    - name: Configure MultiLLM team usage monitoring (gateway + per-user collectors)
      ansible.builtin.include_tasks: multillm_tasks.yml
      when: install_multillm_gateway | default(true)

    - name: Configure disconnect-resilience layer (durable agent sessions, mosh, memory palace)
      ansible.builtin.include_tasks: resilience_tasks.yml
      when: install_resilience_layer | default(true)

    # Tagged so the whole clauded feature can be rolled out on its own with
    # `--tags clauded` (and safely skipped with `--skip-tags clauded`). `apply`
    # propagates the tag to every task in the included file.
    - name: Configure clauded (shared persistent Claude session launcher)
      ansible.builtin.include_tasks:
        file: clauded_tasks.yml
        apply:
          tags: [clauded]
      when: install_resilience_layer | default(true)
      tags: [clauded]

    - name: Configure Agent-OS (tool guardrails, MCP registry, OCI read-only MCP)
      ansible.builtin.include_tasks: agent_os_tasks.yml
      when: install_agent_os | default(true)

    - name: Configure user environments
      ansible.builtin.include_tasks: user_tasks.yml
      loop: "{{ developers }}"
      loop_control:
        loop_var: dev
        label: "{{ dev.name }}"
      tags: [oci_skills, user_config]
    - name: Install AI CLI agents globally
      block:
        - name: Install Claude Code CLI
          community.general.npm:
            name: "@anthropic-ai/claude-code"
            global: true
            state: present
          when: install_claude_code
          ignore_errors: true

        - name: Install Codex CLI
          community.general.npm:
            name: "@openai/codex"
            global: true
            state: present
          when: install_codex
          ignore_errors: true

        - name: Install Gemini CLI
          community.general.npm:
            name: "@google/gemini-cli"
            global: true
            state: present
          when: install_gemini
          ignore_errors: true

        # The CLIs below ship platform packages for linux-x64 AND linux-arm64
        # (or are pure Node), so the same npm install works on both. See
        # docs/TOOLCHAIN.md for the per-tool architecture verification notes.
        #
        # pi and the Copilot CLI need Node >= 22 at RUNTIME. The gate checks the
        # actually-installed Node major, not NODE_VERSION: a re-run does not
        # upgrade an existing Node install, so the declared value can lie.
        - name: Detect the installed Node.js major version
          ansible.builtin.command:
            cmd: node --version
          register: node_runtime_version
          changed_when: false
          failed_when: false

        - name: Compute the installed Node.js major version
          ansible.builtin.set_fact:
            node_major: >-
              {{ node_runtime_version.stdout | default('v0', true)
                 | regex_replace('^v(\d+).*$', '\1') | int }}

        - name: Install OpenCode CLI
          community.general.npm:
            name: "opencode-ai"
            global: true
            state: present
          when: install_opencode | default(false)
          ignore_errors: true

        - name: Install pi coding agent CLI (needs Node >= 22)
          community.general.npm:
            name: "@earendil-works/pi-coding-agent"
            global: true
            state: present
          when:
            - install_pi | default(false)
            - node_major | int >= 22
          ignore_errors: true

        - name: Install Cline CLI
          community.general.npm:
            name: "cline"
            global: true
            state: present
          when: install_cline | default(false)
          ignore_errors: true

        - name: Install GitHub Copilot CLI (needs Node >= 22)
          community.general.npm:
            name: "@github/copilot"
            global: true
            state: present
          when:
            - install_copilot_cli | default(false)
            - node_major | int >= 22
          ignore_errors: true

    - name: Note Node-22-only agent CLIs skipped
      # pi and the Copilot CLI require a newer Node than the one installed; say
      # so instead of failing or silently not installing them.
      ansible.builtin.debug:
        msg: >-
          Node.js v{{ node_major | default('?') }} is installed but pi
          (@earendil-works/pi-coding-agent) and the GitHub Copilot CLI require
          Node >= 22. Set NODE_VERSION=22 and upgrade Node (a fresh deploy picks
          it up automatically; an existing one needs `apt install nodejs` after
          the repo switch), then re-run to install the ones you enabled.
      when:
        - (node_major | default(0)) | int < 22
        - (install_pi | default(false)) or (install_copilot_cli | default(false))

    - name: Configure local LLM serving (Ollama + client wiring)
      ansible.builtin.include_tasks: ollama_tasks.yml
      when: install_ollama | default(false)

    - name: Install pair-claude shared session helper
      ansible.builtin.copy:
        dest: /usr/local/bin/pair-claude
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/bash
          set -euo pipefail
          SOCKET="/tmp/shared-claude.sock"
          SESSION_NAME="shared-claude"

          show_help() {
              echo "Usage: pair-claude <command> [arguments]"
              echo ""
              echo "Commands:"
              echo "  start       Start a shared Claude Code session in tmux"
              echo "  join        Join / attach to the active shared Claude Code session"
              echo "  status      Check the status of the shared session and active users"
              echo "  note <text> Save a pairing note to the shared context bus"
              echo "  summary     Capture the session transcript to the shared context bus"
              echo "  kill        Save a summary, then terminate the shared session"
              echo "  help        Show this help message"
          }

          # Push pairing context to the shared bus so whoever joins later has continuity.
          save_summary() {
              command -v context >/dev/null 2>&1 || { echo "context CLI not found; skipping bus save."; return 0; }
              if [ ! -S "$SOCKET" ] || ! tmux -S "$SOCKET" has-session -t "$SESSION_NAME" 2>/dev/null; then
                  echo "No active shared session to summarize."; return 0
              fi
              local content
              content="$(tmux -S "$SOCKET" capture-pane -p -t "$SESSION_NAME" -S -200 2>/dev/null | tail -120 || true)"
              if context put "pair-session $(date -u +%Y-%m-%dT%H:%MZ)" "$content" --category pairing --shared >/dev/null 2>&1; then
                  echo "Pairing summary saved to the shared context bus (recall: context search pairing --shared)."
              else
                  echo "Could not save to the context bus."
              fi
          }

          case "${1:-help}" in
              start)
                  echo "Starting shared Claude Code session..."
                  if tmux -S "$SOCKET" has-session -t "$SESSION_NAME" 2>/dev/null; then
                      echo "Session '$SESSION_NAME' is already running. Attaching..."
                      exec tmux -S "$SOCKET" attach-session -t "$SESSION_NAME"
                  fi
                  rm -f "$SOCKET"
                  CMD="claude"
                  if ! command -v claude &>/dev/null; then
                      CMD="bash"
                  fi
                  tmux -S "$SOCKET" new-session -d -s "$SESSION_NAME" "$CMD"
                  if getent group developers >/dev/null; then
                      chgrp developers "$SOCKET"
                  fi
                  chmod 770 "$SOCKET"
                  echo "Shared session started! Other developers can run: pair-claude join"
                  exec tmux -S "$SOCKET" attach-session -t "$SESSION_NAME"
                  ;;
              join)
                  if [ ! -S "$SOCKET" ]; then
                      echo "Error: Shared session socket not found. Run 'pair-claude start' first."
                      exit 1
                  fi
                  exec tmux -S "$SOCKET" attach-session -t "$SESSION_NAME"
                  ;;
              status)
                  if [ -S "$SOCKET" ] && tmux -S "$SOCKET" has-session -t "$SESSION_NAME" 2>/dev/null; then
                      echo "Shared session: ACTIVE"
                  else
                      echo "Shared session: INACTIVE"
                  fi
                  ;;
              note)
                  shift
                  TEXT="${*:-}"
                  [ -n "$TEXT" ] || { echo "usage: pair-claude note \"<text>\""; exit 1; }
                  if command -v context >/dev/null 2>&1; then
                      context put "pair-note $(date -u +%Y-%m-%dT%H:%MZ)" "$TEXT" --category pairing --shared >/dev/null 2>&1 \
                          && echo "Note saved to the shared context bus." || echo "Could not save the note."
                  else
                      echo "context CLI not found."
                  fi
                  ;;
              summary)
                  save_summary
                  ;;
              kill)
                  save_summary
                  tmux -S "$SOCKET" kill-session -t "$SESSION_NAME" 2>/dev/null || true
                  rm -f "$SOCKET"
                  echo "Shared session killed."
                  ;;
              *)
                  show_help
                  ;;
          esac

    - name: Install systemd unit template for code-server
      ansible.builtin.copy:
        dest: /etc/systemd/system/code-server@.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=code-server for %i
          After=network.target

          [Service]
          Type=exec
          User=%i
          ExecStart=/home/%i/.local/bin/code-server
          Restart=always
          RestartSec=5
          Environment=HOME=/home/%i

          [Install]
          WantedBy=multi-user.target

    # Everything per-developer lives in developer_account_tasks.yml (which includes
    # user_tasks.yml), so `make apply-pending` materializes a runtime-added
    # developer through the exact same tasks. Runs here — after XRDP,
    # /opt/shared-dev and the code-server unit template, which it depends on.
    - name: Configure developer environments
      ansible.builtin.include_tasks: developer_account_tasks.yml
      loop: "{{ developers }}"
      loop_control:
        loop_var: dev
        label: "{{ dev.name }}"
      tags: [oci_skills, user_config]
      when: install_code_server | default(true)

    - name: Install landing dashboard page
      block:
        - name: Create dashboard directory
          ansible.builtin.file:
            path: /opt/dashboard
            state: directory
            mode: '0755'

        - name: Build dashboard landing template
          ansible.builtin.copy:
            dest: /opt/dashboard/index.html
            owner: root
            group: root
            mode: '0644'
            content: |
              <!DOCTYPE html>
              <html lang="en">
              <head>
                  <meta charset="UTF-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1.0">
                  <title>Developer Collaboration Hub</title>
                  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
                  <style>
                      :root {
                          --bg: #090b10;
                          --card-bg: rgba(255, 255, 255, 0.03);
                          --card-border: rgba(255, 255, 255, 0.08);
                          --accent: #6c5ce7;
                          --accent-hover: #5b4bc4;
                          --text: #f1f2f6;
                          --text-muted: #a4b0be;
                      }
                      * { box-sizing: border-box; margin: 0; padding: 0; }
                      body {
                          font-family: 'Outfit', sans-serif;
                          background: var(--bg);
                          color: var(--text);
                          min-height: 100vh;
                          display: flex;
                          flex-direction: column;
                          align-items: center;
                          justify-content: center;
                          padding: 2rem;
                          overflow-x: hidden;
                      }
                      .container {
                          width: 100%;
                          max-width: 1200px;
                          z-index: 1;
                      }
                      header {
                          text-align: center;
                          margin-bottom: 4rem;
                      }
                      h1 {
                          font-size: 3rem;
                          font-weight: 800;
                          background: linear-gradient(135deg, #a8a5ff 0%, #6c5ce7 100%);
                          -webkit-background-clip: text;
                          -webkit-text-fill-color: transparent;
                          margin-bottom: 0.5rem;
                      }
                      .subtitle { color: var(--text-muted); font-size: 1.1rem; }
                      .grid {
                          display: grid;
                          grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
                          gap: 2rem;
                          margin-bottom: 4rem;
                      }
                      .card {
                          background: var(--card-bg);
                          border: 1px solid var(--card-border);
                          border-radius: 16px;
                          padding: 2rem;
                          backdrop-filter: blur(12px);
                          transition: all 0.3s ease;
                          display: flex;
                          flex-direction: column;
                          justify-content: space-between;
                      }
                      .card:hover {
                          transform: translateY(-5px);
                          border-color: rgba(108, 92, 231, 0.4);
                          box-shadow: 0 10px 30px rgba(108, 92, 231, 0.1);
                      }
                      .card-header {
                          display: flex;
                          justify-content: space-between;
                          align-items: start;
                          margin-bottom: 1.5rem;
                      }
                      .dev-badge {
                          background: rgba(108, 92, 231, 0.15);
                          color: #a8a5ff;
                          border: 1px solid rgba(108, 92, 231, 0.3);
                          padding: 0.25rem 0.75rem;
                          border-radius: 20px;
                          font-size: 0.8rem;
                          font-weight: 600;
                      }
                      .info-row {
                          display: flex;
                          justify-content: space-between;
                          margin-bottom: 0.75rem;
                          font-size: 0.95rem;
                      }
                      .info-label { color: var(--text-muted); }
                      .info-value { font-weight: 600; }
                      .btn {
                          display: inline-block;
                          background: var(--accent);
                          color: #fff;
                          text-decoration: none;
                          padding: 0.75rem;
                          border-radius: 8px;
                          text-align: center;
                          font-weight: 600;
                          margin-top: 1.5rem;
                          transition: background 0.2s ease;
                      }
                      .btn:hover { background: var(--accent-hover); }
                  </style>
              </head>
              <body>
                  <div class="container">
                      <header>
                          <h1>Developer Collaboration Hub</h1>
                          <p class="subtitle">Secure sequential workspaces &amp; pairing terminals</p>
                          <a class="btn" style="max-width:320px;margin:1.5rem auto 0;display:block;" href="http://{{ wg_server_ip }}:{{ multillm_gateway_port | default(8080) }}/dashboard" target="_blank">Open MultiLLM Usage Dashboard</a>
                          <a class="btn" style="max-width:320px;margin:0.75rem auto 0;display:block;background:#29c46b;" href="/agents.html">🛰️ Live Agent Board</a>
                      </header>
                      <div class="grid">
                      {% for dev in developers %}
                          <div class="card">
                              <div>
                                  <div class="card-header">
                                      <h2>{{ dev.name }}</h2>
                                      <span class="dev-badge">isolated UNIX user</span>
                                  </div>
                                  <div class="info-row"><span class="info-label">SSH</span><span class="info-value">{{ dev.name }}@{{ wg_server_ip }}</span></div>
                                  <div class="info-row"><span class="info-label">Web IDE port</span><span class="info-value">{{ dev.code_server_port }}</span></div>
                                  <div class="info-row"><span class="info-label">VPN IP</span><span class="info-value">{{ dev.wg_ip }}</span></div>
                              </div>
                              <a class="btn" href="http://{{ wg_server_ip }}:{{ dev.code_server_port }}" target="_blank">Launch {{ dev.name }} Web IDE</a>
                          </div>
                      {% endfor %}
                      </div>
                  </div>
              </body>
              </html>

    - name: Create Python SimpleHTTPServer unit for dashboard
      ansible.builtin.copy:
        dest: /etc/systemd/system/dev-dashboard.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Developer Landing Page Dashboard
          After=network.target

          [Service]
          Type=simple
          User=root
          WorkingDirectory=/opt/dashboard
          ExecStart=/usr/bin/python3 -m http.server {{ dashboard_port | default(80) }}
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start dev-dashboard service
      ansible.builtin.systemd:
        name: dev-dashboard
        enabled: true
        state: restarted
        daemon_reload: true

    # Single source of truth for every port this stack exposes — ufw on the Debian
    # family, firewalld on the RedHat family, skipped cleanly when neither exists.
    - name: Configure the host firewall
      ansible.builtin.include_tasks: firewall_tasks.yml
      vars:
        firewall_rules: >-
          {{
            [
              {'port': 22, 'proto': 'tcp'},
              {'port': dashboard_port | default(80), 'proto': 'tcp'},
              {'port': wg_port | default(51820), 'proto': 'udp'}
            ]
            + ([{'port': rdp_port | default(3389), 'proto': 'tcp'}]
               if (install_desktop | default(true)) else [])
            + ([{'port': multillm_gateway_port | default(8080), 'proto': 'tcp',
                 'from_ip': wg_network | default('10.200.200.0/24')}]
               if (install_multillm_gateway | default(true)) else [])
            + ([{'port': ollama_port | default(11434), 'proto': 'tcp',
                 'from_ip': wg_network | default('10.200.200.0/24')}]
               if (install_ollama | default(false)) else [])
            + ([{'port': control_plane_port | default(8082), 'proto': 'tcp',
                 'from_ip': wg_network | default('10.200.200.0/24')}]
               if (install_agent_os | default(true)) else [])
            + ([{'port': '60000:61000', 'proto': 'udp',
                 'from_ip': wg_network | default('10.200.200.0/24')}]
               if (install_resilience_layer | default(true)) else [])
          }}

    # Direct installs only: a provisioned VM already had cloud-init do this.
    - name: Configure the WireGuard server (direct install)
      ansible.builtin.include_tasks: wireguard_tasks.yml
      when: install_wireguard | default(false)

    - name: Post-deploy verification (informational — warnings don't fail the deploy)
      ansible.builtin.command:
        cmd: /usr/local/bin/verify-agent-os
      environment:
        WG_SERVER_IP: "{{ wg_server_ip | default('10.200.200.1') }}"
        MULTILLM_GATEWAY_PORT: "{{ multillm_gateway_port | default(8080) | string }}"
        DASHBOARD_PORT: "{{ dashboard_port | default(80) | string }}"
        CONTROL_PLANE_PORT: "{{ control_plane_port | default(8082) | string }}"
      register: verify_out
      changed_when: false
      failed_when: false
      when: install_agent_os | default(true)

    - name: Show verification summary
      ansible.builtin.debug:
        msg: "{{ verify_out.stdout_lines | default(['verification skipped']) }}"
      when: install_agent_os | default(true)

  handlers:
    - name: Restart multillm-gateway
      ansible.builtin.systemd:
        name: multillm-gateway
        state: restarted
        daemon_reload: true
      ignore_errors: true

    - name: Restart sshd
      ansible.builtin.service:
        name: "{{ os_sshd_service | default('sshd') }}"
        state: restarted
      ignore_errors: true

    - name: Restart wireguard
      ansible.builtin.systemd:
        name: wg-quick@wg0
        state: restarted
      ignore_errors: true
