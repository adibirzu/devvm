---
# Debian / Ubuntu package names, services and conventions.
# Loaded by playbook.yml from vars/{{ ansible_os_family }}.yml.

os_family_supported: true
os_needs_epel: false

# `wireguard` pulls the kernel module glue; `wireguard-tools` gives us `wg`.
os_base_packages:
  # Ansible's become_user (every per-developer task) shells out to sudo, which a
  # minimal image may not have.
  - sudo
  - apt-transport-https
  - ca-certificates
  - curl
  - software-properties-common
  - jq
  - wireguard
  - wireguard-tools
  - tmux
  - git
  - vim
  - dbus-x11
  - ssl-cert
  - python3-pip
  - python3-venv
  - gnupg
  - lsb-release
  - unzip

os_pipx_package: pipx

# What `python3 -m venv` needs. On RHEL it is part of the base python3 install.
os_venv_packages:
  - python3-venv
  - python3-pip

os_container_packages:
  - podman
  - podman-docker
  - buildah
  - skopeo
  - uidmap
  - slirp4netns
  - fuse-overlayfs

# qemu-system-arm ships the aarch64 machine on Ubuntu arm64; qemu-utils gives
# qemu-img; qemu-efi-aarch64 provides the UEFI firmware for aarch64 guests.
os_qemu_packages:
  - qemu-system-arm
  - qemu-utils
  - qemu-efi-aarch64

# Playwright 1.63 publishes tested Chromium builds for Ubuntu 22.04/24.04/26.04
# on x86-64 and arm64. Keep the upstream runtime package sets keyed by release
# because Ubuntu's time64 transition renamed several packages in 24.04.
os_browser_testing_packages_by_release:
  "22":
    - xvfb
    - fonts-noto-color-emoji
    - fonts-unifont
    - libfontconfig1
    - libfreetype6
    - xfonts-cyrillic
    - xfonts-scalable
    - fonts-liberation
    - fonts-ipafont-gothic
    - fonts-wqy-zenhei
    - fonts-tlwg-loma-otf
    - fonts-freefont-ttf
    - libasound2
    - libatk-bridge2.0-0
    - libatk1.0-0
    - libatspi2.0-0
    - libcairo2
    - libcups2
    - libdbus-1-3
    - libdrm2
    - libgbm1
    - libglib2.0-0
    - libnspr4
    - libnss3
    - libpango-1.0-0
    - libwayland-client0
    - libx11-6
    - libxcb1
    - libxcomposite1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxkbcommon0
    - libxrandr2
  "24": &ubuntu_time64_browser_packages
    - xvfb
    - fonts-noto-color-emoji
    - fonts-unifont
    - libfontconfig1
    - libfreetype6
    - xfonts-cyrillic
    - xfonts-scalable
    - fonts-liberation
    - fonts-ipafont-gothic
    - fonts-wqy-zenhei
    - fonts-tlwg-loma-otf
    - fonts-freefont-ttf
    - libasound2t64
    - libatk-bridge2.0-0t64
    - libatk1.0-0t64
    - libatspi2.0-0t64
    - libcairo2
    - libcups2t64
    - libdbus-1-3
    - libdrm2
    - libgbm1
    - libglib2.0-0t64
    - libnspr4
    - libnss3
    - libpango-1.0-0
    - libx11-6
    - libxcb1
    - libxcomposite1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxkbcommon0
    - libxrandr2
  "26": *ubuntu_time64_browser_packages

os_desktop_packages:
  - xfce4
  - xfce4-goodies
  - xrdp

os_resilience_packages:
  - tmux
  - mosh

os_nodejs_package: nodejs

os_dev_packages:
  - rustup
  - ripgrep
  - fd-find
  - bat
  - fzf
  - direnv
  - shellcheck
  - just
  - yq
  - postgresql-client
  - sqlite3

# Debian calls the SSH daemon unit `ssh`; RHEL calls it `sshd`.
os_sshd_service: ssh
os_admin_sudo_group: sudo
os_firewall_backend: ufw
os_firewall_package: ufw
# XRDP reads the TLS cert from /etc/ssl/private, guarded by the ssl-cert group.
os_has_ssl_cert_group: true
