---
- name: Create bin, applications, and local directories
  ansible.builtin.file:
    path: "/home/{{ dev.name }}/{{ item }}"
    state: directory
    owner: "{{ dev.name }}"
    group: "{{ dev.name }}"
    mode: '0755'
  loop:
    - bin
    - .local
    - .local/bin
    - Applications
    - .config
    - .config/code-server

# A cloud-init VM already has ~/.ssh from the injected key; a freshly created
# account on a direct install does not, and the per-user ssh config needs it.
- name: Ensure the developer's ~/.ssh exists
  ansible.builtin.file:
    path: "/home/{{ dev.name }}/.ssh"
    state: directory
    owner: "{{ dev.name }}"
    group: "{{ dev.name }}"
    mode: '0700'

- name: Check if Cursor binary exists
  ansible.builtin.stat:
    path: /opt/cursor/cursor.AppImage
  register: cursor_bin

- name: Symlink Cursor for developer
  ansible.builtin.file:
    src: /opt/cursor/cursor.AppImage
    dest: "/home/{{ dev.name }}/Applications/cursor.AppImage"
    state: link
    # Own the link, not the shared AppImage it points at.
    follow: false
    owner: "{{ dev.name }}"
    group: "{{ dev.name }}"
  when: install_cursor and (cursor_bin.stat.exists | default(false))

- name: Check if code-server already installed
  ansible.builtin.stat:
    path: "/home/{{ dev.name }}/.local/bin/code-server"
  register: code_server_bin
  when: install_code_server

- name: Install code-server via script
  ansible.builtin.shell: |
    curl -fsSL https://code-server.dev/install.sh | sh -s -- --method=standalone --prefix=/home/{{ dev.name }}/.local
  args:
    creates: "/home/{{ dev.name }}/.local/bin/code-server"
  become_user: "{{ dev.name }}"
  when: install_code_server and not (code_server_bin.stat.exists | default(false))

- name: Configure code-server port
  ansible.builtin.copy:
    dest: "/home/{{ dev.name }}/.config/code-server/config.yaml"
    owner: "{{ dev.name }}"
    group: "{{ dev.name }}"
    mode: '0644'
    content: |
      bind-addr: 0.0.0.0:{{ dev.code_server_port }}
      auth: none
      cert: false
  when: install_code_server

- name: Configure git settings for user
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  become_user: "{{ dev.name }}"
  loop:
    - { name: "init.defaultBranch", value: "main" }
    - { name: "core.editor", value: "vim" }
    - { name: "pull.rebase", value: "false" }
    # Per-user GitHub identity — each account commits as itself.
    - { name: "user.name", value: "{{ dev.git_name | default(dev.name) }}" }
    - { name: "user.email", value: "{{ dev.git_email | default(dev.name + '@users.noreply.github.com') }}" }
    # Shared repos under /opt/shared-dev are group-owned; allow git to operate in them.
    - { name: "safe.directory", value: "/opt/shared-dev" }
    - { name: "safe.directory", value: "*" }

# Bulletproof attribution in SHARED repos: env vars outrank a repo-level user.email
# (which one developer could set in a shared .git/config), so each account's commits
# are always attributed to that account — regardless of the folder or repo config.
- name: Enforce per-user git identity via environment (overrides repo-level config)
  ansible.builtin.blockinfile:
    path: "/home/{{ dev.name }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED — per-user git identity"
    create: true
    owner: "{{ dev.name }}"
    group: "{{ dev.name }}"
    mode: '0644'
    block: |
      export GIT_AUTHOR_NAME="{{ dev.git_name | default(dev.name) }}"
      export GIT_AUTHOR_EMAIL="{{ dev.git_email | default(dev.name + '@users.noreply.github.com') }}"
      export GIT_COMMITTER_NAME="{{ dev.git_name | default(dev.name) }}"
      export GIT_COMMITTER_EMAIL="{{ dev.git_email | default(dev.name + '@users.noreply.github.com') }}"
      # Each account authenticates to GitHub as itself: run `gh auth login` once
      # (creds live in ~/.config/gh, never shared) or add your own key to ~/.ssh.
      # Never set a shared GITHUB_TOKEN — it would make everyone push as one account.

- name: Per-user SSH config routes github.com through this account's own key
  ansible.builtin.blockinfile:
    path: "/home/{{ dev.name }}/.ssh/config"
    marker: "# {mark} ANSIBLE MANAGED — github identity"
    create: true
    owner: "{{ dev.name }}"
    group: "{{ dev.name }}"
    mode: '0600'
    block: |
      Host github.com
          HostName github.com
          User git
          IdentityFile ~/.ssh/id_github
          IdentitiesOnly yes

- name: Install MultiLLM gateway for developer
  when: install_multillm_gateway | default(true)
  ansible.builtin.shell: |
    export PIP_BREAK_SYSTEM_PACKAGES=1
    bash /opt/multillm/install.sh
  args:
    creates: "/home/{{ dev.name }}/.local/bin/claude-multillm"
  become_user: "{{ dev.name }}"
  ignore_errors: true

# --- per-developer agent CLIs that upstream ships as vendor installers -------
# These scripts all detect OS and architecture themselves (x86_64 and arm64
# Linux are supported by each — see docs/TOOLCHAIN.md) and install into the
# developer's own home, so they must run with become_user. Global npm CLIs
# (claude/codex/gemini/opencode/cline/...) are instead installed once in
# playbook.yml.

- name: Check if the Antigravity CLI is already installed
  ansible.builtin.stat:
    path: "/home/{{ dev.name }}/.local/bin/agy"
  register: agy_bin
  when: install_antigravity | default(true)

- name: Install the Antigravity CLI (agy) for developer
  ansible.builtin.shell: |
    curl -fsSL https://antigravity.google/cli/install.sh | bash
  args:
    creates: "/home/{{ dev.name }}/.local/bin/agy"
  become_user: "{{ dev.name }}"
  environment:
    HOME: "/home/{{ dev.name }}"
  when:
    - install_antigravity | default(true)
    - not (agy_bin.stat.exists | default(false))

- name: Check whether the Antigravity CLI is ready
  ansible.builtin.stat:
    path: "/home/{{ dev.name }}/.local/bin/agy"
  register: agy_bin
  when: install_antigravity | default(true)

- name: Check if the Cursor agent CLI is already installed
  ansible.builtin.stat:
    path: "/home/{{ dev.name }}/.local/bin/cursor-agent"
  register: cursor_agent_bin
  when: install_cursor_agent | default(false)

- name: Install the Cursor agent CLI for developer
  ansible.builtin.shell: |
    curl https://cursor.com/install -fsS | bash
  args:
    creates: "/home/{{ dev.name }}/.local/bin/cursor-agent"
  become_user: "{{ dev.name }}"
  environment:
    HOME: "/home/{{ dev.name }}"
  when:
    - install_cursor_agent | default(false)
    - not (cursor_agent_bin.stat.exists | default(false))

- name: Check if the Grok CLI is already installed
  ansible.builtin.stat:
    path: "/home/{{ dev.name }}/.grok/bin/grok"
  register: grok_bin
  when: install_grok | default(false)

- name: Install the Grok CLI (xAI) for developer
  ansible.builtin.shell: |
    curl -fsSL https://x.ai/cli/install.sh | bash
  args:
    creates: "/home/{{ dev.name }}/.grok/bin/grok"
  become_user: "{{ dev.name }}"
  environment:
    HOME: "/home/{{ dev.name }}"
  when:
    - install_grok | default(false)
    - not (grok_bin.stat.exists | default(false))

- name: Check whether the Grok CLI is ready
  ansible.builtin.stat:
    path: "/home/{{ dev.name }}/.grok/bin/grok"
  register: grok_bin
  when: install_grok | default(false)

# The Grok installer drops the binary into ~/.grok/bin but does not put that
# directory on PATH; link it into ~/.local/bin, which every shell here has.
- name: Link the Grok CLI onto the developer's PATH
  ansible.builtin.file:
    src: "/home/{{ dev.name }}/.grok/bin/grok"
    dest: "/home/{{ dev.name }}/.local/bin/grok"
    state: link
    force: true
    follow: false
  when:
    - install_grok | default(false)
    - grok_bin.stat.exists | default(false)

# Install the OCI Administrator skill pack into each enabled agent harness for
# this developer (Claude Code, Codex, Gemini CLI, Antigravity). install.sh is
# idempotent and only reads /opt/oci-skills, writing into the user's own
# ~/.claude, ~/.codex, ~/.gemini, ~/.antigravity skill directories.
#
# A harness is only advertised when its CLI actually exists on this box: the
# antigravity entry additionally requires the agy binary installed above, so a
# failed vendor download can never leave a skills directory for a harness that
# is not there.
- name: Install OCI Administrator skill pack for developer
  when: install_oci_skills | default(true)
  tags: [oci_skills]
  become_user: "{{ dev.name }}"
  vars:
    # Build the harness list in Ansible (reliable), not via in-shell Jinja. A
    # single pure {{ }} expression returns a native list (not a string), so the
    # argv concatenation below stays a proper list.
    oci_skills_harnesses: "{{ (['claude'] if (install_claude_code | default(true)) else []) + (['codex'] if (install_codex | default(true)) else []) + (['gemini'] if (install_gemini | default(true)) else []) + (['antigravity'] if ((install_antigravity | default(true)) and (agy_bin.stat.exists | default(false))) else []) }}"
  # Run the executable directly (its shebang is bash); avoids /bin/sh + pipefail.
  ansible.builtin.command:
    argv: "{{ ['/opt/oci-skills/install.sh'] + oci_skills_harnesses }}"
  register: oci_skills_install
  changed_when: "'install' in (oci_skills_install.stdout | default(''))"
  ignore_errors: true

- name: Register Claude Notification hook (feeds the board's notification ring)
  become_user: "{{ dev.name }}"
  ansible.builtin.shell: |
    set -e
    HOOKS="$HOME/.claude/hooks.json"
    mkdir -p "$HOME/.claude"
    python3 - "$HOOKS" <<'PY'
    import json, os, sys
    path = sys.argv[1]
    data = {}
    if os.path.exists(path):
        try:
            data = json.load(open(path))
        except Exception:
            data = {}
    arr = data.setdefault("Notification", [])
    if not any("claude-notify-hook" in json.dumps(e) for e in arr):
        arr.append({"hooks": [{"type": "command", "command": "/usr/local/bin/claude-notify-hook"}]})
        json.dump(data, open(path, "w"), indent=2)
        print("added")
    else:
        print("present")
    PY
  register: notify_hook
  changed_when: "'added' in notify_hook.stdout"

- name: Register guardrail PreToolUse hook (blocks destructive tool calls)
  become_user: "{{ dev.name }}"
  when: install_agent_os | default(true)
  ansible.builtin.shell: |
    set -e
    HOOKS="$HOME/.claude/hooks.json"
    mkdir -p "$HOME/.claude"
    python3 - "$HOOKS" <<'PY'
    import json, os, sys
    path = sys.argv[1]
    data = {}
    if os.path.exists(path):
        try:
            data = json.load(open(path))
        except Exception:
            data = {}
    arr = data.setdefault("PreToolUse", [])
    # Apply to the tools we gate; "matcher" empty means all tools in Claude Code.
    entry = {"matcher": "Bash|Write|Edit|MultiEdit|NotebookEdit|Read",
             "hooks": [{"type": "command", "command": "/usr/local/bin/guardrail-hook"}]}
    if not any("guardrail-hook" in json.dumps(e) for e in arr):
        arr.append(entry)
        json.dump(data, open(path, "w"), indent=2)
        print("added")
    else:
        print("present")
    PY
  register: guardrail_hook
  changed_when: "'added' in guardrail_hook.stdout"

- name: Generate ~/.claude/.mcp.json from the approved MCP registry
  become_user: "{{ dev.name }}"
  when: install_agent_os | default(true)
  ansible.builtin.command:
    cmd: /usr/local/bin/mcp-registry apply --registry /opt/agent-os/registry.json
  environment:
    MULTILLM_GATEWAY_PORT: "{{ multillm_gateway_port | default(8080) }}"
  register: mcp_apply
  changed_when: "'applied' in mcp_apply.stdout"

# Local-LLM wiring (opt-in via INSTALL_OLLAMA): point the developer's shell at
# the shared Ollama server without hijacking their cloud-authenticated CLIs.
# `ollama` works through OLLAMA_HOST; Claude Code gets a claude-local alias
# (Ollama serves the Anthropic Messages API natively); codex reaches local
# models with `codex --oss`; Gemini CLI accepts an OpenAI-compatible provider.
- name: Wire the developer shell to the local LLM server
  when: install_ollama | default(false)
  tags: [user_config]
  ansible.builtin.blockinfile:
    path: "/home/{{ dev.name }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED — local LLM (Ollama)"
    create: true
    owner: "{{ dev.name }}"
    group: "{{ dev.name }}"
    mode: '0644'
    block: |
      export OLLAMA_HOST="{{ ollama_effective_bind }}:{{ ollama_port }}"
      # Local-model session (cloud `claude` stays untouched):
      alias claude-local='ANTHROPIC_BASE_URL=http://{{ ollama_effective_bind }}:{{ ollama_port }} ANTHROPIC_AUTH_TOKEN=ollama ANTHROPIC_MODEL={{ ollama_default_model }} ANTHROPIC_DEFAULT_HAIKU_MODEL={{ ollama_default_model }} claude'
      # Codex: run `codex --oss` | Gemini CLI: add an OpenAI-compatible provider at http://{{ ollama_effective_bind }}:{{ ollama_port }}/v1
