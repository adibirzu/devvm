---
# firstmate_tasks.yml — system-level Firstmate setup (run once, no dev loop).
#
# Clones the captain's fork to /opt/firstmate, sets permissions.
# Per-developer setup (symlink, npm, herdr, treehouse) lives in
# firstmate_per_user_tasks.yml and is called from the dev loop.
#
# A clone/copy failure must not abort the rest of the playbook: later
# firstmate_per_user_tasks.yml skips when firstmate_ready is false.
# Idempotent; safe to re-run.

- name: firstmate | Clone the firstmate repository (captain's fork)
  ansible.builtin.git:
    repo: "{{ firstmate_git_url | default('https://github.com/adibirzu/firstmate.git') }}"
    dest: /opt/firstmate
    version: "{{ firstmate_git_version | default('main') }}"
    force: true
  when: not (firstmate_source_path | default('')) | length > 0
  ignore_errors: true

- name: firstmate | Copy from local source path when provided
  ansible.builtin.copy:
    src: "{{ firstmate_source_path }}"
    dest: /opt/
    owner: root
    group: developers
    mode: '0775'
  when: (firstmate_source_path | default('')) | length > 0
  ignore_errors: true

- name: firstmate | Check the cloned tree
  ansible.builtin.stat:
    path: /opt/firstmate
  register: firstmate_tree

- name: firstmate | Record whether the tree is ready
  ansible.builtin.set_fact:
    firstmate_ready: "{{ (firstmate_tree.stat.exists | default(false)) and (firstmate_tree.stat.isdir | default(false)) }}"

- name: firstmate | Note when the tree is missing so per-user setup can skip
  ansible.builtin.debug:
    msg: >-
      Firstmate source is not at /opt/firstmate (clone or local copy failed).
      Skipping Firstmate permissions and per-developer setup; the rest of the
      playbook continues. Re-run with FIRSTMATE_GIT_URL or FIRSTMATE_SOURCE_PATH
      pointing at a reachable tree.
  when: not (firstmate_ready | default(false))

- name: firstmate | Ensure /opt/firstmate is group-accessible
  ansible.builtin.file:
    path: /opt/firstmate
    state: directory
    owner: root
    group: developers
    mode: '0775'
  when: firstmate_ready | default(false)

- name: firstmate | Ensure bin/ scripts are executable
  ansible.builtin.file:
    path: "/opt/firstmate/bin/{{ item }}"
    mode: '0755'
  loop:
    - fm-install-herdr.sh
    - fm-install-treehouse.sh
  when: firstmate_ready | default(false)
  failed_when: false
