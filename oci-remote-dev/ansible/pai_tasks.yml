---
# Phase 6 — PAI / Obi integration. Deploys PAI per-user (never system-wide, never
# into /opt/shared-dev), installs the pluggable agent-runtime registry + the
# multi-device encrypted-MEMORY sync tool, and ensures `age` is available for
# personal-MEMORY encryption at rest. Gated by install_pai.
#
# Privacy model: each developer's PAI lives in their own 0700 home tree; personal
# MEMORY is age-encrypted at rest and decrypted only in-session. The shareable
# parts (skills/Algorithm/hooks) ride the PAI repo; personal MEMORY rides a
# separate PRIVATE encrypted repo. See docs/PAI-INTEGRATION.md.

- name: PAI | Install age (personal-MEMORY encryption at rest)
  ansible.builtin.apt:
    name:
      - age
    state: present
  when: pai_encrypt_memory | default(true) | bool

# Antigravity (AGY) — Google's terminal coding agent; replaces the Gemini CLI as
# the Google-family runtime. Installs the `agy` binary fleet-wide. Headless auth
# (agy prints a URL + one-time code over SSH) is done per-user on first run.
#
# We deliberately do NOT pipe the installer straight into a shell interpreter.
# Instead: download to a file, then execute that file. This makes the fetched
# script auditable on disk, lets an admin inspect/checksum it, and avoids the
# blind remote-code-execution anti-pattern. Set agy_installer_sha256 to pin it.
- name: PAI | Fetch the Antigravity (AGY) installer to disk (auditable)
  ansible.builtin.get_url:
    url: "{{ agy_installer_url | default('https://antigravity.google/cli/install.sh') }}"
    dest: /opt/agent-os/agy-install.sh
    mode: '0750'
    owner: root
    group: developers
    checksum: "{{ ('sha256:' + agy_installer_sha256) if (agy_installer_sha256 | default('')) else omit }}"
  register: agy_fetch
  failed_when: false
  when: install_antigravity | default(true) | bool

# AGY installs to $HOME/.local/bin (TARGET_DIR in the installer). Run it PER-USER
# (not root, which would land in /root/.local/bin and never reach a developer PATH),
# with stdin closed so the installer's "no terminal → skip interactive prompts" path
# triggers. `creates` points at the real per-user binary path.
- name: PAI | Run the Antigravity installer per-developer (no tty, $HOME/.local/bin)
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.shell: "/bin/bash /opt/agent-os/agy-install.sh </dev/null"
  args:
    creates: "/home/{{ item.name }}/.local/bin/agy"
  loop: "{{ developers }}"
  register: agy_install
  changed_when: "'installed' in (agy_install.stdout | default('') | lower)"
  failed_when: false
  when:
    - install_antigravity | default(true) | bool
    - agy_fetch is succeeded
    - developers | length > 0

# Hermes (Nous Research) — local agent runtime, registered so the SAME Telegram/
# WhatsApp bots can drive it on the VM. Headless one-shot is `hermes -z "<prompt>"`.
# Installed per-user (NOT root) because chmod 600 gives zero isolation between two
# agents under the same UID. Download-then-run, --skip-browser for headless servers.
- name: PAI | Fetch the Hermes installer to disk (auditable)
  ansible.builtin.get_url:
    url: "{{ hermes_installer_url | default('https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh') }}"
    dest: /opt/agent-os/hermes-install.sh
    mode: '0750'
    owner: root
    group: developers
    checksum: "{{ ('sha256:' + hermes_installer_sha256) if (hermes_installer_sha256 | default('')) else omit }}"
  register: hermes_fetch
  failed_when: false
  when: install_hermes | default(false) | bool

# CRITICAL: close stdin (`</dev/null`). The Hermes installer's `setup` stage is
# `needs_user_input:true` and launches an interactive API-key wizard (`hermes setup`)
# whenever a terminal is present — under Ansible that wizard blocks FOREVER. With
# stdin closed the installer hits its own "no terminal available → skip setup
# wizard" path and exits cleanly; the per-user runs `hermes setup` later, by hand.
# --skip-browser avoids the Chromium pull on a headless server.
- name: PAI | Install Hermes per-developer (no tty → skips interactive setup wizard)
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.shell: "/bin/bash /opt/agent-os/hermes-install.sh --skip-browser </dev/null"
  args:
    creates: "/home/{{ item.name }}/.local/bin/hermes"
  environment:
    HERMES_HOME: "/home/{{ item.name }}/.hermes"
  loop: "{{ developers }}"
  register: hermes_install
  changed_when: "'installed' in (hermes_install.stdout | default('') | lower)"
  failed_when: false
  when:
    - install_hermes | default(false) | bool
    - hermes_fetch is succeeded
    - developers | length > 0

- name: PAI | Harden Hermes secrets per-developer (chmod 600 on .env/SOUL/config)
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.shell: |
    set -e
    H="/home/{{ item.name }}/.hermes"
    [ -d "$H" ] || exit 0
    for f in .env SOUL.md config.yaml auth.json exec-policy.json; do
      [ -f "$H/$f" ] && chmod 600 "$H/$f" || true
    done
    for d in memories sessions cron credentials; do
      [ -d "$H/$d" ] && chmod 700 "$H/$d" || true
    done
    echo hardened
  loop: "{{ developers }}"
  changed_when: false
  failed_when: false
  when:
    - install_hermes | default(false) | bool
    - developers | length > 0

- name: PAI | Library directory for shared agent-runtime data
  ansible.builtin.file:
    path: /opt/agent-os
    state: directory
    owner: root
    group: developers
    mode: '0775'

- name: PAI | Deploy the pluggable agent-runtime registry
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../agent-os/runtimes.json"
    dest: /opt/agent-os/runtimes.json
    owner: root
    group: developers
    mode: '0664'

- name: PAI | Install fleet PAI CLIs (runtime registry, sync, bootstrap)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: developers
    mode: '0755'
  loop:
    - { src: "{{ playbook_dir }}/../scripts/pai_runtime_registry.py", dest: /usr/local/bin/pai-runtimes }
    - { src: "{{ playbook_dir }}/../scripts/pai_sync.py", dest: /usr/local/bin/pai-sync }
    - { src: "{{ playbook_dir }}/../scripts/pai_bootstrap.sh", dest: /usr/local/bin/pai-bootstrap }

- name: PAI | Validate the deployed runtime registry
  ansible.builtin.command:
    cmd: /usr/local/bin/pai-runtimes --registry /opt/agent-os/runtimes.json validate
  changed_when: false

- name: PAI | Bootstrap PAI for each developer (per-user, never as root)
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.command:
    cmd: /usr/local/bin/pai-bootstrap
  environment:
    PAI_REPO: "{{ pai_repo | default('') }}"
    PAI_MEMORY_REPO: "{{ pai_memory_repo | default('') }}"
    PAI_SYNC_ENABLED: "{{ pai_sync_enabled | default('false') | string }}"
    PAI_AGE_RECIPIENTS: "{{ pai_age_recipients | default('') }}"
  loop: "{{ developers }}"
  register: pai_bootstrap_result
  changed_when: "'cloning' in pai_bootstrap_result.stdout | default('')"
  failed_when: false
