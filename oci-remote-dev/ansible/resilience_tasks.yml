---
# Resilience layer — keep coding agents working through WireGuard / SSH / internet
# drops, and let developers reattach on reconnect.
#
# Mechanisms:
#   * agentctl runs agents in detached tmux on the VM (decoupled from the client);
#   * `loginctl enable-linger <user>` keeps user processes alive after logout;
#   * mosh gives a client link that survives IP changes, sleep, and roaming;
#   * sshd + tmux are tuned for long-lived, reattachable sessions.

- name: Resilience | Install tmux + mosh
  ansible.builtin.apt:
    name:
      - tmux
      - mosh
    state: present

- name: Resilience | Install agentctl (durable agent sessions)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/agentctl.sh"
    dest: /usr/local/bin/agentctl
    owner: root
    group: developers
    mode: '0755'

- name: Resilience | Install palace (memory palace CLI)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/palace.sh"
    dest: /usr/local/bin/palace
    owner: root
    group: developers
    mode: '0755'

- name: Resilience | Install git-whoami (verify per-account GitHub identity)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/git_whoami.sh"
    dest: /usr/local/bin/git-whoami
    owner: root
    group: developers
    mode: '0755'

- name: Resilience | Install agent-notify (notification-ring feed)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/agent_notify.sh"
    dest: /usr/local/bin/agent-notify
    owner: root
    group: developers
    mode: '0755'

- name: Resilience | Install Claude notification-hook adapter
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/claude_notify_hook.sh"
    dest: /usr/local/bin/claude-notify-hook
    owner: root
    group: developers
    mode: '0755'

- name: Resilience | Keep user processes alive after logout (linger)
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ item.name }}"
    creates: "/var/lib/systemd/linger/{{ item.name }}"
  loop: "{{ developers }}"

- name: Resilience | Restore agent sessions on boot (replays agentctl metadata)
  ansible.builtin.copy:
    dest: /etc/systemd/system/agentctl-restore.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Recreate durable agent sessions after a reboot
      After=network-online.target multillm-gateway.service
      Wants=network-online.target

      [Service]
      Type=oneshot
      # Replay each developer's agentctl sessions as that user (skips --no-restart).
      ExecStart=/bin/bash -c 'for u in {{ developers | map(attribute="name") | join(" ") }}; do runuser -u "$u" -- /usr/local/bin/agentctl restore || true; done'

      [Install]
      WantedBy=multi-user.target

- name: Resilience | Enable the boot-time agent restore service
  ansible.builtin.systemd:
    name: agentctl-restore.service
    enabled: true
    daemon_reload: true

- name: Resilience | Sensible tmux defaults for long-lived agent sessions
  ansible.builtin.copy:
    dest: "/home/{{ item.name }}/.tmux.conf"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: '0644'
    content: |
      # Resilience-friendly tmux defaults (managed by Ansible)
      set -g history-limit 50000
      set -g mouse on
      setw -g aggressive-resize on
      set -g status-right "#[fg=cyan]#S #[fg=white]| %Y-%m-%d %H:%M"
      # Survive client churn cleanly; don't destroy detached sessions.
      set -g destroy-unattached off
  loop: "{{ developers }}"

- name: Resilience | sshd keepalive + tolerate brief link loss
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-resilience.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Detect dead peers but tolerate transient WireGuard/internet blips.
      ClientAliveInterval 30
      ClientAliveCountMax 20
      TCPKeepAlive yes
  notify: Restart sshd

- name: Resilience | Open mosh UDP range over the WireGuard subnet only
  ansible.builtin.ufw:
    rule: allow
    from_ip: "{{ wg_network | default('10.200.200.0/24') }}"
    port: "60000:61000"
    proto: udp

# ── Live multi-agent status board ────────────────────────────────────────────
- name: Resilience | Install agent-status aggregator
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/agent_status.py"
    dest: /usr/local/bin/agent-status
    owner: root
    group: developers
    mode: '0755'

- name: Resilience | Ensure dashboard directory exists
  ansible.builtin.file:
    path: /opt/dashboard
    state: directory
    mode: '0755'

- name: Resilience | Install the agent board page
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../dashboard/agents.html"
    dest: /opt/dashboard/agents.html
    owner: root
    group: root
    mode: '0644'

- name: Resilience | agent-status snapshot service (writes agents.json)
  ansible.builtin.copy:
    dest: /etc/systemd/system/agent-status.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Aggregate live agent sessions into /opt/dashboard/agents.json
      After=network-online.target

      [Service]
      Type=oneshot
      # Budgets drive the board's over-budget badge/banner (Phase 1 tail).
      Environment=MULTILLM_USER_BUDGETS={{ multillm_user_budgets | default('') }}
      ExecStart=/usr/local/bin/agent-status --home-root /home \
        --gateway http://{{ wg_server_ip | default('10.200.200.1') }}:{{ multillm_gateway_port | default(8080) }} \
        --out /opt/dashboard/agents.json

- name: Resilience | agent-status timer (every 15s)
  ansible.builtin.copy:
    dest: /etc/systemd/system/agent-status.timer
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Refresh the agent board every 15 seconds

      [Timer]
      OnBootSec=30s
      OnUnitActiveSec=15s
      AccuracySec=2s

      [Install]
      WantedBy=timers.target

- name: Resilience | Reload systemd + enable the agent-status timer
  ansible.builtin.systemd:
    name: agent-status.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Resilience | Install project-status aggregator
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/project_status.py"
    dest: /usr/local/bin/project-status
    owner: root
    group: developers
    mode: '0755'

- name: Resilience | project-status snapshot service (writes projects.json)
  ansible.builtin.copy:
    dest: /etc/systemd/system/project-status.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Aggregate per-project git state + active agents into /opt/dashboard/projects.json
      After=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/project-status --home-root /home --out /opt/dashboard/projects.json

- name: Resilience | project-status timer (every 30s)
  ansible.builtin.copy:
    dest: /etc/systemd/system/project-status.timer
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Refresh the project board every 30 seconds

      [Timer]
      OnBootSec=45s
      OnUnitActiveSec=30s
      AccuracySec=5s

      [Install]
      WantedBy=timers.target

- name: Resilience | Reload systemd + enable the project-status timer
  ansible.builtin.systemd:
    name: project-status.timer
    enabled: true
    state: started
    daemon_reload: true
